# OpenSourceScout: Fit Criteria (DRAFT v4)
# ============================================================================
# The flow (top to bottom):
#   1. meta: goal and project definitions
#   2. definitions: evaluation vocabulary
#   3. assessment: facts and worthiness in one pass (Layer 1)
#   4. funnel: routing disposition (Layer 2)
#   5. capital_gate: capital status check
#   6. judging: evaluation method (idea vs. repo)
#   7. never_reject_on
#
#   ASSESS (facts + worthiness) -> ROUTE -> capital STATUS
# ============================================================================

meta:
  purpose: >
    For each candidate (a GitHub repo or an idea): assess it (facts and whether
    it is worth time, in one pass), route it (independent / too_big / adopt / merge /
    upstream_pr / simplify_fork / combined / rejected), then review capital requirements last.
    Money is evaluated at the final step.
    Scope includes developer tools and non-developer products.
  # Your private portfolio lives in config.local.yaml (git-ignored), not in this public file.
  # criteria.yaml is the shareable framework; config.local.yaml holds local data.
  existing_projects: "-> config.local.yaml (git-ignored)"   # for MERGE and strategic payoff

# ---------------------------------------------------------------------------
# 2. DEFINITIONS
# ---------------------------------------------------------------------------
definitions:
  one_person_project: >
    Buildable and maintainable by one person working with AI tools.
    AI multiplies build capacity, so the scope threshold is high. A project
    exceeds one-person scope when it requires an ongoing team.

  worth_doing: >
    Non-trivial value with a plausible audience and room to differentiate, that
    has at least one payoff, passes quality standards, warrants investment,
    and is not a high-liability domain.

  warrants_investment: >
    Payoff must justify scarce resources: developer time and strong model reasoning.
    Spend bulk build tokens freely while protecting developer attention.

  liability_risk: >
    Judged by liability severity, not by domain label. High liability indicates that
    incorrect output causes legal, financial, or physical harm, or requires regulatory
    compliance or licensed expertise from day one (such as medical diagnosis, investment
    advice, or legal counsel). Non-advisory utilities in similar spaces (such as budgeting
    trackers or workout loggers) carry low liability risk and remain eligible.

  durability: >
    Informational classification only (see ai_at_run). Never a deciding factor.

# ---------------------------------------------------------------------------
# 3. ASSESSMENT: Layer 1 facts and worthiness in one pass.
#    Output keeps facts and the verdict separate for reuse.
# ---------------------------------------------------------------------------
assessment:

  # ---- FACTS (recorded on every candidate) ----
  facts:
    category: >
      One controlled category for portfolio balance and distribution planning.
      Spans developer and non-developer domains. Seeds: [devtools, automation,
      ai-tooling, data, content, productivity, education, creative, consumer, infra].
    payoff: >
      What value was identified during evaluation. Always present, never empty:
      one or more of [commercial, reputation, learning, strategic], or the explicit [none].
      A value of `none` indicates an evaluation was completed and found no practical payoff;
      `none` stands alone and routes to `rejected`. A positive payoff is required for active dispositions:
        commercial = revenue potential. reputation = public recognition. learning = strategic learning.
        strategic = utility to an existing project or target:
          strategic:product     utility inside an existing project or target (a shippable feature);
                                the merge/combined payoff.
          strategic:capability  upgrades internal build steps (UI verification, data management, testing)
                                to make recurring development faster and more reliable across projects.
      Bar for strategic:capability: counts only if it upgrades a recurring build step.
    provides_features: []            # Parts-bin key. Pick only from capabilities.yaml.
                                     # Matched against target needs_features. Shared vocabulary is required
                                     # for set-cover matching. Propose new terms in capabilities.yaml when needed.
                                     # Avoid brand names: a feature describes what a tool does.
    provides_specifics: []           # Free text for nuance beyond controlled terms. Uncontrolled,
                                     # preserved for reference context without set-cover matching.
    ai_at_build: none | helpful | required
    ai_at_run:   none | optional | required
    ai_note: >
      Categorization only: ai_at_build, ai_at_run, and emerging_class do not dictate
      worthiness or routing. Non-AI products compete equally.
    emerging_class: >
      Highlight if ai_at_build in {helpful, required} and ai_at_run == none (build-with-AI, run-AI-free).
      A spotlight tag, not a filter.
    license:
      name: ""
      state: file | declared_only | none
      declared_in: []                # LICENSE file, README, or package metadata (pyproject/package.json)
      state_note: >
        declared_only: an express grant exists (README or package metadata declares license terms such as MIT)
        even if a standalone LICENSE file is omitted. GitHub API reports "no license" in this scenario because
        it searches for license files specifically. Review README and package metadata before treating a candidate
        as unlicensed. Treat declared_only as low-risk usable and request the upstream repository add the file.
        Only `none` (no license statement anywhere) represents a legal block.
      attribution_required: null
      copyleft: null                 # must open-source derivative work (blocks closed products)
      commercial_ok: null
    capital_to_launch: zero | needs_money   # see capital_gate
    paid_dependencies: []            # mini-target: scout free and active alternatives
    install_risk: none | manual_review | agent_forbidden
    install_note: >
      Evaluates package installation mechanisms. Adoption involves executing upstream code,
      making installation safety an explicit review criterion.
        none            = standard package install without install hooks. Installing executes nothing.
        manual_review   = includes custom setup scripts or writes outside the project directory.
                          Review script content before running manually.
        agent_forbidden = uses unpinned curl-to-shell patterns or downloads external binaries on activation.
      Rules: (1) Agents do not run installers. (2) Pin versions rather than using @latest with auto-confirm.
      (3) Verify activation behavior alongside install steps. (4) Check reported security issues before running.
      Install risk governs adoption procedure rather than direct rejection eligibility.
    liability_risk: >
      low | high. High indicates wrong outputs cause legal, financial, or physical harm, or require
      formal regulatory licensing. Non-advisory utilities in similar spaces are low risk.
    tags: []                         # discovery tags, separate from controlled categories.

  # ---- WORTHINESS (evaluated against the disposition in question) ----
  worthiness:
    requires_all:
      - "payoff: at least one of commercial / reputation / learning / strategic"
      - "passes quality standards"
      - "warrants investment of developer time and reasoning"
      - "liability_risk is LOW"
    judged_against: >
      Evaluated relative to the disposition under review. A single-feature repository may not
      warrant independent build effort while remaining valuable as an inventory component.
    does_not_decide: [ai_at_build, ai_at_run, emerging_class, durability, capital]

# ---------------------------------------------------------------------------
# 4. FUNNEL: Layer 2 routing (first match applies)
# ---------------------------------------------------------------------------
funnel:
  - step: 1
    disposition: independent
    ask: "Worthy and within solo developer project scope?"
  - step: "1b"
    disposition: too_big
    ask: "Worthy but requires a team? Defer or partner rather than forcing a merge."
  - step: "1c"
    disposition: adopt
    only_if_prior_no: true
    ask: "A complete, healthy existing tool to use as-is without building, forking, or folding in?"
    means: >
      Run unchanged as an external dependency in product workflows or build pipelines.
      Distinct from `independent` (already exists) and `merge` (code remains separate).
    serves: "product_workflow | build_pipeline (strategic:capability adoption)"
    still_capital_gated: "adopting paid dependencies routes status to parked_capital"
    install_gate: >
      Adoption involves running third-party code. Record install_risk and follow safety rules
      (pin version, manual human installation, verify activation behavior).
      Review source code over documentation claims.
  - step: 2
    disposition: merge
    only_if_prior_no: true
    ask: "Can it merge into an existing project, or into the build pipeline as a capability?"
    merge_home: "product (existing project) | build_pipeline (strategic:capability upgrade)"
    modes: { as_is: "whole, unchanged", modify_fully: "rework to fit", harvest_parts: "take useful components" }
    harvest_type: >
      code: reuse implementation directly (same language).
      blueprint: reimplement the architectural approach (different language or clean-room implementation).
    license_gate: "Verify licensing terms per project."
  - step: 3
    disposition: upstream_pr
    only_if_prior_no: true
    ask: "Valuable core with addressable UX complexity or friction where the codebase is manageable for an upstream pull request?"
    means: "Contribute fixes directly upstream rather than maintaining a separate project."
    license_gate: >
      Verify repository contribution terms (CLA, DCO, licensing). Ensure authority to grant
      contributions under existing intellectual property agreements.
  - step: "3b"
    disposition: simplify_fork
    only_if_prior_no: true
    ask: "Valuable core with high UX friction where an upstream PR is unviable, and licensing permits wrapping or forking?"
    means: "Create a simplified wrapper or client library over the core logic under license compliance."
    license_gate: >
      Analyze wrapper integration architecture (separate process vs. linked dependency)
      and distribution obligations under copyleft or permissive terms.
  - step: 4
    disposition: combined
    only_if_prior_no: true
    ask: "Do its features fulfill a target product definition when pooled with other candidate repositories?"
    method: "Target-driven feature set-cover matching provides_features to needs_features. Outputs a build kit."
    target_kinds: "Product target (open alternative to proprietary software) or build-capability target (internal pipeline tooling)."
  - step: 5
    disposition: rejected
    only_if_prior_no: true
    note: >
      Retained as feature-tagged inventory. Serves as component supply for future targets
      and reference material for new product definitions.

# ---------------------------------------------------------------------------
# 4b. RE-VALIDATION: re-evaluating provisional inventory on context changes
# ---------------------------------------------------------------------------
revalidation:
  principle: >
    Evaluations reflect portfolio state, targets, and criteria at the time of review.
    Context updates trigger re-evaluation of relevant candidate inventory.
  triggers:                       # Context changed: update relevant candidate evaluations
    - new_or_changed_rule        # rule updates resurface affected candidates
    - new_project_or_stack       # adding a project or stack triggers matching candidate re-evaluations
    - new_target                 # target needs_features trigger inventory set-cover matching
    - dependency_or_health_shift # new free alternative or abandoned incumbent
  also_re_judge_on:               # evaluation corrections independent of context changes
    - facts_drift                # Stage 0 re-fetch updated factual metadata
    - correction                 # previous evaluation interpretation challenged or corrected
  how: >
    Inventory notes retain tags (tags + provides_features) enabling targeted queries.
    Triggers match by stack, feature, or domain rather than running full sweeps.
  history: >
    Re-judging appends an evaluation entry to preserve historical context. Each entry
    records the outcome of a review (modifications, updated assumptions, and new conclusions).
    The latest entry represents the active verdict. Judgments do not overwrite factual metadata.

# ---------------------------------------------------------------------------
# 5. CAPITAL GATE: final capital verification. Money is not an initial filter.
# ---------------------------------------------------------------------------
capital_gate:
  principle: >
    Initial launch requires zero capital (free tiers or self-hosted hardware).
    Scaling is funded from revenue.
  capital_to_launch: >
    Must be zero. Paid dependencies route status to parked_capital.
  capital_to_scale: >
    Funded from revenue once established.
  status: active | parked_capital
  parked_capital:
    means: "Viable candidate requiring paid dependencies; revisit when funded or alternative found."
    unblock: >
      Each paid dependency represents a mini-target: identify an active free alternative
      to swap into the configuration.

# ---------------------------------------------------------------------------
# 6. JUDGING: evaluation methods (ideas vs. repositories)
# ---------------------------------------------------------------------------
judging:
  idea: { method: ai_direct, why: "direct reasoning evaluates raw concepts without metadata" }
  repo:
    method: automated_then_ai
    automated: ["gather GitHub metadata", "run the funnel on hard facts"]
    escalate_to_ai: { trigger: "borderline cases or qualitative criteria", agent: "agent second opinion" }

# ---------------------------------------------------------------------------
# 7. NEVER REJECT ON
# ---------------------------------------------------------------------------
never_reject_on:
  - spoken_language
  - programming_language   # Evaluated stack-blind. Technology choices guide execution strategy
                           # (code harvest vs. blueprint reimplementation), not rejection.
  - capital                # Final check, not an initial filter (see capital_gate).
  - ai_at_run              # Descriptive categorization, not merit scoring.
  - install_risk           # Determines adoption procedure, not rejection eligibility.

# ---------------------------------------------------------------------------
# Extra evidence the judge weighs (context factors, not gates)
# ---------------------------------------------------------------------------
factors_to_weigh:
  - demand_and_audience
  - differentiation / whitespace vs. existing solutions
  - paywalled_incumbents_raise_worth
  - maintenance_health / traction        # for the candidate and its dependencies
  - dependency_health                    # unmaintained dependencies represent risk
  - integration_effort                   # merge track evaluation
