# OpenSourceScout — CONTROLLED VOCABULARY for `provides_features`.
# ============================================================================
# WHY THIS EXISTS
# provides_features is the parts-bin key: the combination step (criteria.yaml
# funnel step 4) works by matching a candidate's provides_features against a
# target's needs_features. That REQUIRES a shared vocabulary.
#
# Without one, it doesn't work at all. Measured on a real 654-candidate corpus:
# 1136 distinct feature slugs, 95.6% of them used by exactly ONE candidate. Set-cover
# could never match anything, and the "top" slugs were brand names (`browserbase-api-
# wrapper`, `stagehand-sdk`) — describing what a repo is CALLED, not what it DOES.
# That violates the framework's own rule: a feature is what it DOES.
#
# HOW TO USE
#   provides_features:  pick from THIS list only. Coarse on purpose — overlap is the
#                       whole point. If nothing fits, propose a new term here (a PR to
#                       the vocabulary), don't invent a one-off slug in a note.
#   provides_specifics: free text for the nuance the coarse term loses
#                       (e.g. "OpenAPI + GraphQL, property-based").
#
# Format:  term: [alias, alias, ...]   — aliases drive scripts/normalize_features.py
# ============================================================================

capabilities:

  # ---- agents / orchestration -------------------------------------------
  agent-orchestration: [swarm, multi-agent, coordinator, orchestration, consensus, delegation, subagent]
  agent-harness: [harness, control-layer, agent-runtime, agent-platform, meta-harness]
  workflow-engine: [workflow, dag, state-machine, process-automation]   # NB: "pipeline" is too generic — it stole rag-pipeline
  task-queue: [queue, async-task, job-runner, task-center, scheduler-queue]
  prompt-management: [prompt, prompt-template, prompt-hardening, system-prompt, instruction]
  skill-packaging: [skill, skills, plugin, extension, marketplace, rules-file]
  mcp-server: [mcp, model-context-protocol]
  model-routing: [multi-provider, model-management, llm-gateway, provider-fallback, model-selection]
  context-management: [context, compaction, context-window, token-budget, summarisation]
  memory-persistence: [memory, persistence, session-memory, recall, learning-loop, self-learning]
