# OpenSourceScout: example configuration. Copy to config.local.yaml and customize.
# ---------------------------------------------------------------------------
# criteria.yaml (public) holds the rules. This file holds the data those rules
# judge against: your portfolio, your quality standards, your category vocabulary.
# config.local.yaml is git-ignored and stays local to your environment.
# ---------------------------------------------------------------------------

# Where the project list comes from:
#   local     -> use existing_projects below (standalone; default)
#   <path>    -> read an external registry instead, e.g. ../my-other-project/projects/
# Whichever is selected serves as the source of truth to prevent configuration drift.
# Auto-detection is disabled by default to prevent unexpected portfolio selection.
portfolio_source: local

# Judge backend model (optional). Decouples backend model from code.
# e.g., opencode/deepseek-v4.1-flash-free
model: opencode/deepseek-v4.1-flash-free

existing_projects:              # for the merge question and strategic payoff evaluation
  - name: example-app
    what: "One sentence: what it does, and for whom."
    stack: [python, fastapi, postgres]
    category: devtools
    status: "active build"

  - name: example-site
    what: "A second project, providing a target for merge evaluations."
    stack: [typescript, nextjs]
    category: content
    status: "live"

standards: >
  Your quality bar in one sentence: what makes something pass for your standards.
  e.g. "solves a real recurring annoyance, and is shippable free in under two weeks".

# Controlled category vocabulary: pick exactly one per candidate.
# Spans both developer tools and non-developer products.
categories:
  - devtools
  - automation
  - ai-tooling
  - data
  - content
  - productivity
  - education
  - creative
  - consumer
  - infra
